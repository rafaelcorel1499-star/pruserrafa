name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller pillow pytest

      - name: Pruebas del parser de SMS
        run: python -m pytest -q

      - name: Generar icono
        run: python tools/make_icon.py

      - name: Compilar EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NequiPayMonitor --icon assets/icon.ico --paths src --collect-submodules pyttsx3 --collect-submodules edge_tts --collect-submodules aiohttp --hidden-import comtypes --hidden-import comtypes.client --hidden-import pythoncom --hidden-import win32com src/main.py

      - name: Compilar Keygen (programa del administrador)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NequiPayKeygen --icon assets/icon.ico --paths src --paths keygen keygen/keygen.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NequiPayMonitor-windows
          path: dist/NequiPayMonitor.exe

      - name: Subir Keygen como artefacto (NO se publica en Releases)
        uses: actions/upload-artifact@v4
        with:
          name: NequiPayKeygen-windows
          path: dist/NequiPayKeygen.exe

      - name: Publicar Release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NequiPayMonitor.exe
